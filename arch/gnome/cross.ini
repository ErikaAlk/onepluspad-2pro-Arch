[constants]
sysroot = '@DIRNAME@' / 'sysroot'

[binaries]
c = 'aarch64-linux-gnu-gcc'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'
cups-config = sysroot / 'usr/bin/cups-config'
exe_wrapper = ['qemu-aarch64-static', '-L', sysroot]

[properties]
sys_root = sysroot
pkg_config_libdir = [sysroot / 'usr/lib/pkgconfig', sysroot / 'usr/share/pkgconfig', '/usr/share/pkgconfig']
needs_exe_wrapper = true

[built-in options]
c_args = ['--sysroot=' + sysroot, '-isystem', sysroot / 'usr/include', '-fstack-protector-strong', '-fstack-clash-protection', '-D_FORTIFY_SOURCE=3', '-fno-plt', '-fno-semantic-interposition']
c_link_args = ['--sysroot=' + sysroot, '-L' + sysroot / 'usr/lib', '-Wl,-z,relro,-z,now', '-Wl,-Bsymbolic-functions']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
