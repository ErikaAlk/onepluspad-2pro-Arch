[core]
detection_notice = true
no_confirmation = true
abort_if_ssh = true
abort_if_lid_closed = false
disabled = true
use_cnn = false
workaround = off
auth_ui = false

[video]
certainty = 3.5
timeout = 5
startup_timeout = 7
recording_plugin = gstreamer
gstreamer_pipeline = libcamerasrc camera-name="/base/soc@0/geniqup@8c0000/i2c@884000/camera@10"
    ! video/x-raw,width=640,height=480,format=RGBx ! videoconvert
    ! video/x-raw,format=BGR ! appsink max-buffers=1 drop=true sync=false
rotation_quarter_turns = 0
device_path = /dev/video2
warn_no_device = true
frame_width = -1
frame_height = -1
max_height = 480
dark_threshold = 60
force_mjpeg = false
exposure = -1
device_fps = 0
rotate = 3

[snapshots]
save_failed = false
save_successful = false

[rubberstamps]
enabled = false

[debug]
end_report = false
verbose_stamps = false
gtk_stdout = false
