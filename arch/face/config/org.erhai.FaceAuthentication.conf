<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="${FACE_USER}">
    <allow own="org.erhai.FaceAuthentication"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.erhai.FaceAuthentication"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.erhai.FaceAuthentication"/>
  </policy>
</busconfig>
